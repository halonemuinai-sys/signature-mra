<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRA Group — Email Signature Studio</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Blue & White Theme Stylesheet -->
  <link rel="stylesheet" href="css/cms.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="https://cdn.jsdelivr.net/gh/halonemuinai-sys/signature-mra@main/mra_logo.png" alt="MRA Group Logo">
      <h1>Signature CMS</h1>
    </div>
    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="savePreset()">
        <i class="fa-regular fa-bookmark"></i> Save Preset
      </button>
      <button class="btn btn-primary" onclick="copyRichText()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Copy for Outlook
      </button>
    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="container">
    
    <!-- Left Panel: Controls & Customization -->
    <aside class="panel">
      <div class="panel-header">
        <h2 class="panel-title"><i class="fa-solid fa-sliders"></i> Signature Studio Settings</h2>
      </div>

      <!-- Template Selector -->
      <div class="form-group">
        <label for="template"><i class="fa-solid fa-layer-group"></i> Signature Template</label>
        <select id="template">
          <option value="corporate_v6">Corporate V6 — Bold Color Block ✨</option>
          <option value="corporate_v5">Corporate V5 — Minimal 2026</option>
          <option value="corporate_v4_premier" selected>Corporate V4 Premier — Modern Card Layout</option>
          <option value="corporate_v2_wide">Corporate Wide — Horizontal Gold</option>
          <option value="corporate_v2">Corporate V2 — 13 Brand</option>
          <option value="corporate_v1">Corporate V1 — 17 Brand</option>
          <option value="corporate_v3">Corporate V3 — Personal Detail</option>
        </select>
      </div>

      <!-- Theme Selector -->
      <div class="form-group">
        <label for="theme"><i class="fa-solid fa-palette"></i> Signature Color Variant</label>
        <select id="theme">
          <option value="gold" selected>Corporate Gold</option>
          <option value="monochrome">Classic Monochrome</option>
          <option value="navy">Navy Blue</option>
          <option value="emerald">Emerald Green</option>
          <option value="burgundy">Burgundy Red</option>
          <option value="royal">Royal Purple</option>
        </select>
      </div>

      <!-- Personal Info Section -->
      <div class="section-title"><i class="fa-regular fa-user"></i> Personal Information</div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" value="Aris Munandar" placeholder="e.g. Aris Munandar">
        </div>
        <div class="form-group">
          <label for="title">Job Title</label>
          <input type="text" id="title" value="IT Support Specialist" placeholder="e.g. Senior Manager">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Corporate Email</label>
          <input type="email" id="email" value="aris@mraretail.co.id" placeholder="name@mraretail.co.id">
        </div>
        <div class="form-group">
          <label for="phone">Office Phone</label>
          <input type="text" id="phone" value="6221 2765 1868" placeholder="6221 2765 1868">
        </div>
      </div>

      <!-- Company Location Section -->
      <div class="section-title"><i class="fa-solid fa-building"></i> Office Location</div>

      <div class="form-group">
        <label for="address">Office Address</label>
        <textarea id="address" rows="2">Wisma MRA, Jl. TB Simatupang&#10;No. 19 Jakarta, 12430, Indonesia</textarea>
      </div>

      <div class="form-group">
        <label for="website">Company Website</label>
        <input type="text" id="website" value="www.mra.co.id">
      </div>

      <!-- Brand Logos Selector -->
      <div class="section-title"><i class="fa-solid fa-tags"></i> Brand Grid Manager</div>
      
      <!-- Quick Group Select: instantly set active brands to one division -->
      <div class="brand-group-select">
        <span class="quick-label">Quick Select Group:</span>
        <button class="group-btn group-luxury" onclick="selectBrandGroup('luxury')"><i class="fa-solid fa-gem"></i> Luxury</button>
        <button class="group-btn group-fnb" onclick="selectBrandGroup('fnb')"><i class="fa-solid fa-utensils"></i> F&amp;B</button>
        <button class="group-btn group-media" onclick="selectBrandGroup('media')"><i class="fa-solid fa-newspaper"></i> Media</button>
      </div>

      <!-- Category Tabs & Quick Actions -->
      <div class="brand-filter-tabs">
        <button class="filter-tab active" data-category="all" onclick="setBrandCategory('all')">All Brands</button>
        <button class="filter-tab" data-category="luxury" onclick="setBrandCategory('luxury')">Luxury</button>
        <button class="filter-tab" data-category="fnb" onclick="setBrandCategory('fnb')">F&B</button>
        <button class="filter-tab" data-category="media" onclick="setBrandCategory('media')">Media</button>
      </div>

      <div class="brand-quick-actions">
        <span style="font-size: 0.75rem; color: var(--text-muted);"><i class="fa-solid fa-up-down-left-right"></i> Drag & Drop to Reorder:</span>
        <div>
          <button class="text-btn" onclick="selectAllBrands(true)">Select All</button>
          <span style="color: var(--border-color);">•</span>
          <button class="text-btn" onclick="selectAllBrands(false)">Clear</button>
          <span style="color: var(--border-color);">•</span>
          <button class="text-btn" onclick="resetBrandOrder()">Reset</button>
        </div>
      </div>

      <div id="brand-selector" class="brand-selector-grid">
        <!-- Dynamically rendered by cms.js -->
      </div>

      <!-- Presets List -->
      <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Saved Presets</div>
      <div id="preset-list" class="preset-list">
        <!-- Dynamically rendered by cms.js -->
      </div>
    </aside>

    <!-- Right Panel: Real-time Live Preview & Actions -->
    <section class="preview-container">
      
      <!-- Toolbar -->
      <div class="preview-toolbar">
        <div class="preview-stats">
          <div class="stat-chip"><i class="fa-solid fa-table-cells"></i> Logos: <span id="stat-brand-count">17 / 17</span></div>
          <div class="stat-chip"><i class="fa-solid fa-ruler-horizontal"></i> Width: <span id="stat-signature-width">840px</span></div>
        </div>

        <div class="preview-mode-toggles">
          <button id="btn-preview-light" class="toggle-btn active" onclick="togglePreviewBg('light')">
            <i class="fa-regular fa-sun"></i> Light Theme
          </button>
          <button id="btn-preview-dark" class="toggle-btn" onclick="togglePreviewBg('dark')">
            <i class="fa-regular fa-moon"></i> Dark Theme
          </button>
        </div>

        <div class="action-bar">
          <button class="btn btn-outline" onclick="copyHTMLCode()">
            <i class="fa-code"></i> Copy HTML
          </button>
          <button class="btn btn-secondary" onclick="downloadHTM()">
            <i class="fa-solid fa-download"></i> Download .htm
          </button>
          <button class="btn btn-primary" onclick="copyRichText()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Copy to Outlook
          </button>
        </div>
      </div>

      <!-- Real-time Live Preview Canvas -->
      <div id="canvas-wrapper" class="preview-canvas-wrapper">
        <div id="signature-preview">
          <!-- Dynamically updated by cms.js -->
        </div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>MRA Group Corporate Email Signature Studio</p>
  </footer>

  <!-- Core JavaScript -->
  <script src="js/cms.js"></script>
</body>
</html>
